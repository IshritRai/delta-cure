[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "delta-cure"
version = "0.0.0"
description = "Curator-aware unlearning: a deletion service for ML training pipelines with learned data filters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
# Runtime dependencies are added, pinned, by the milestone that first needs them.
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/delta_cure"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "D", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"**/__init__.py" = ["D104"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=delta_cure --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["delta_cure"]
